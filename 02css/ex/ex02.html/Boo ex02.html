<!DOCTYPE html>

<html>

<head>
<meta charset="utf-8">
<title>부트스트랩 사용하기</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

    <!--div는 : 영역을 나누는데 활용-->
    <div></div>

    <div class="container">

    <h2>1. 글씨 색상과 정렬</h2>

    <p class="text-primary">파란색 글씨입니다.</p>
    <p class="text-success text-center">가운데 정열은 초록색 글씨입ㄴ니다.</p>
    <p class="text-success text-center">가운데정열은 초록색 글씨</p>
    <p class="text-danger text-end">오른쪽 정렬된 바깐색 글씨입니다.</p>

    <h2>배경색과 여백</h2>
    <!--내부여백 : 영역 내부에 여백을 둔다 (padding) -->
    <p class="bg-warning p-3">안쪽여백이 있는 노란색 배경 입니다.</p>

    <!--외부영역 : 영역외부에 여백을 둔다.(margin)-->
    <p class="bg-info p-2 m-4 rounded">배경색과 안쪽여백 그리고 바깥</p>

    <h2>버튼</h2>
    <button type="button" class="btn btn-primary">확인</button>
    <button type="button" class="btn btn-danger">취소</button>
    <br><br>

    <h2>입력</h2>
    <label>아이디</label>
    <input type="text" class="form-control" placeholder="아이디를 입력하세요">
    <br>

    <label>비밀번호</label>
    <input type="password" class="form-control" placeholder="비밀번호를 입력하세요">

    </div>



</body>




</head>
</html>
