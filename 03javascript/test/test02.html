<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>예금 이자 계산기(연습)</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>   
    <body>
        <div class="container">

            <h2 class="text-center text-primary">예금이자계산기 1</h2>
            <div class="text-center">예금 정보를 입력하고 이자를 계산해 보세요 </div>
            
                <hr>

            <div>
                <h4>예금 정보 입력</h4>

                <label class="mt-3 mb-2">예금 금액(원)</label>
                <input type="number" class="form-control"> <br>

                <label> 연이율 (%) </label>
                <input type="text" class="form-control"> <br>

                <label>예치기간 (년)</label>
                <input type="number" class="form-control"> <br><br>

                <button type="button">이자계산기</button>

            </div>

            <div class="border p-4 rounded mt-3">
                <h3>계산 결과</h3> 
                <hr>

                <div>예상 이자</div>
                <h4 class="text-success mt-2">13600원</h4>

                <div>만기시 총 지급액</div>
                <h4 class="text-primary mt-2">213600원</h4>
            </div>

            <p class="text-secondary mt-3 small"> ※ 세금과 복리를 고려하지 않은 단리 계산입니다.</p>
    

        </div>

        
    </body>
