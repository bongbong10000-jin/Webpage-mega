<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>예약하기(연습)</title>

        <body>
            <h2>예약하기</h2>

            <div>
                <input type="text" placeholder="이름" id="anameInput">
                <br> 
                
                
                <input type="text" placeholder="인원" id="bnameInput">
                <input type="text" placeholder="날짜" id="cnameInput">

                <button type="button" id="confirmbtn">예약하기</button>

            </div>

            <script>
                const confirmbtn = document.querySelector("#confirmbtn");


                confirmbtn.addEventListener("click", ()=> {
                    const anameInput = document.querySelector("#anameInput");
                    const aname = anameInput.value;
                    

                
                    

                    const bnameInput = document.querySelector("#bnameInput");
                    const bname = bnameInput.value;
                    
                

                    const cnameInput = document.querySelector("#cnameInput");
                    const cname = cnameInput.value;
                            
                            alert("이름: " + aname + "\n" + 
                            "인원: " + bname + "명\n" + 
                            "날짜: "+ cname + "일 예약이 접수 되었습니다.");
                        })

            </script>


        </body>

    </head>

</html>
